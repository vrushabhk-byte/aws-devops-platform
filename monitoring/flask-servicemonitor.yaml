apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flask-api
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - production

  selector:
    matchLabels:
      app: flask-api

  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
