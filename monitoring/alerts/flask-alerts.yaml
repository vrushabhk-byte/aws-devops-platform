apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flask-application-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: flask-application
      rules:
        - alert: FlaskApplicationUnavailable
          expr: |
            up{namespace="production", service="flask-api"} == 0
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Flask application target is unavailable"
            description: >-
              Prometheus has been unable to scrape a Flask application target
              in the production namespace for at least 2 minutes.

        - alert: FlaskHighHttp5xxErrorRate
          expr: |
            (
              sum(rate(flask_http_errors_total[5m]))
              /
              clamp_min(sum(rate(flask_http_requests_total[5m])), 0.001)
            ) > 0.05
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Flask HTTP 5xx error rate is high"
            description: >-
              More than 5 percent of Flask requests have returned HTTP 5xx
              responses over the last 5 minutes.

        - alert: FlaskHighP95Latency
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(flask_http_request_duration_seconds_bucket[5m])
              )
            ) > 0.5
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Flask application response latency is high"
            description: >-
              The estimated 95th percentile request latency has exceeded
              500 milliseconds for at least 5 minutes.

        - alert: FlaskContainerRestartingFrequently
          expr: |
            increase(
              kube_pod_container_status_restarts_total{
                namespace="production",
                pod=~"flask-api-.*"
              }[10m]
            ) > 2
          for: 1m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Flask container is restarting frequently"
            description: >-
              A Flask container has restarted more than twice during the
              last 10 minutes.
